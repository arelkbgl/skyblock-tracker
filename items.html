<!DOCTYPE html>
<!--
    Live Bazaar table: current buy/sell prices, flip margins and weekly volume.
    Served by server.js at "/items". Item names link to /chart?item=<id>.
-->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Item Overview</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/items.css">
    </head>
    <body>
        <h1>Item Overview</h1>
        <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16" y1="16" x2="22.5" y2="22.5"></line>
            </svg>
            <input id="search" type="text" placeholder="Search item...">
        </div>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <!-- data-key = the row field this column sorts by -->
                    <th data-key="name">Item</th>
                    <th data-key="buyPrice">Buy</th>
                    <th data-key="sellPrice">Sell</th>
                    <th data-key="margin">Margin</th>
                    <th data-key="marginPercent">Margin Percent</th>
                    <th data-key="weeklyVolume">Weekly Volume</th>
                </tr>
            </thead>
            <tbody id="item-table"></tbody>
        </table>
        </div>
    <script src="/js/items.js"></script>
    </body>
</html>
