<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Bazaar Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-primary: #080B0A;
                --bg-card: #050706;
                --bg-secondary: #101513;

                --accent-green: #0d4210;
                --accent-emerald: #32E65B;
                --accent-dark: #0D2415;

                --text-primary: #F5F7F5;
                --text-secondary: #A7B0AA;

                --border-color: #252C28;

                --coin-gold: #FFC83D;
                --profit-green: #35E58C;
            }

            html {
                font-size: 130%;
            }

            body {
                font-family: "Inter", sans-serif;
                background-color: var(--bg-secondary);
                color: var(--text-primary);
                margin: 0;
            }

            .topbar {
                position: sticky;
                top: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid var(--border-color);
                padding: 4px 12px;
                background-color: var(--bg-primary);
                font-family: "Montserrat", sans-serif;
                font-weight: 500;
                font-size: 0.8rem;
                color: var(--text-secondary);
            }

            .brand img {
                height: 60px;
                display: block;
                margin-top: 8px;
                margin-left: 12px;
            }

            nav {
                display: flex;
                gap: 80px;
            }

            nav a {
                display: flex;
                align-items: center;
                gap: 8px;
                border: 1px solid transparent;
                padding: 12px 24px;
                border-radius: 20px;
                transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            }   

            nav img {
                width: 20px;
                height: 20px;
            }

            nav a:hover {
                border: 1px solid var(--accent-emerald);
                padding: 12px 24px;
                border-radius: 20px;
                background-color: var(--accent-dark);
                text-decoration: none;
                color: var(--text-primary);
                box-shadow: 0 0 16px rgba(57, 231, 95, 0.5);
                transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            }

            .icon {
                width: 20px;
                height: 20px;
                background-color: currentColor;
                mask-size: contain;
            }

            .icon-bz {
                mask-image: url("/images/bazaar.svg");
            }

            .icon-ah {
                mask-image: url(/images/auction-house.svg);
            }

            .icon-flips {
                mask-image: url(/images/flips.svg);
            }

            .icon-ana {
                mask-image: url(/images/analytics.svg);
            }

            .icon-items {
                mask-image: url(/images/items.svg);
            }

            .hero {
                display: flex;
                flex-direction: column;   
                align-items: center;      
                gap: 24px;                
                padding: 40px 0;          
            }

            .hero-logo {
                width: 400px;
                max-width: 90%;           
            }

            .search-box {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 560px;
                max-width: 90%;
                padding: 0 0 0 14px;
                overflow: hidden;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                background-color: var(--bg-primary);
                box-shadow: 0 0 16px rgba(56, 59, 57, 0.5);
                transition: border-color 0.2s ease;
            }

            .search-box:has(#search:focus) {
                border-color: var(--accent-emerald);
                box-shadow: 0 0 16px rgba(57, 231, 95, 0.5);
            }

            .search-box img {
                width: 28px;
                height: 28px;
            }

            #search {
                flex: 1;
                font: inherit;
                color: var(--text-primary);
                background: none;
                border: none;
                outline: none;
                padding: 12px 0;
            }

            .search-button {
                align-self: stretch;          
                display: flex;
                align-items: center;
                padding: 0 18px;
                border: none;
                border-left: 1px solid var(--border-color);
                background-color: var(--accent-dark);
                cursor: pointer;
                transition: background-color 0.2s ease;
            }

            .search-button:hover {
                background-color: var(--accent-green);
            }

            .search-button img {
                width: 32px;
                height: 32px;
                transition: transform 0.2s ease;
            }

            .search-button:hover img {
                transform: translateX(3px);
            }

            .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                max-width: 560px;
                margin: 0 auto;
                padding: 0 24px 40px;
            }

            .card {
                background-color: var(--bg-primary);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                overflow: hidden;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            .card:hover {
                border-color: var(--accent-green);
                box-shadow: 0 0 20px rgba(57, 231, 95, 0.5);;
            }

            .card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                border-bottom: 1px solid var(--border-color);
            }

            .card-header h3 {
                margin: 0;
                font-size: 1.05rem;
                font-weight: 700;
            }

            .view-all {
                color: var(--accent-emerald);
                font-size: 0.85rem;
                font-weight: 600;
            }

            .view-all:hover {
                text-decoration: none;
                color: var(--accent-emerald);
            }

            .card-list {
                list-style: none;
                margin: 0;
                padding: 12px;
            }

            .row {
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 14px;
                padding: 10px 12px;
                border-radius: 8px;
                transition: background-color 0.2s ease;
            }

            .row:hover {
                background-color: var(--bg-secondary);
            }

            .rank {
                display: grid;
                place-items: center;
                width: 34px;
                height: 34px;
                border-radius: 8px;
                background-color: var(--bg-secondary);
                border: 1px solid var(--border-color);
                font-size: 0.8rem;
                font-weight: 700;
                color: var(--text-primary);
            }

            .row:first-child .rank {
                background-color: var(--coin-gold);
                border-color: rgba(255, 200, 61, 0.4);
            }

            .row:nth-child(2) .rank {
                background-color: silver;
                border-color: rgba(192, 192, 192, 0.549);
            }

            .row:nth-child(3) .rank {
                background-color: rgb(205, 127, 50);
                border-color: rgba(205, 128, 50, 0.486);
            }

            .row-info {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .row-name {
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .row-sub {
                font-size: 0.8rem;
                color: var(--text-secondary);
            }

            .row-value {
                padding: 4px 10px;
                border-radius: 6px;
                background-color: rgba(53, 229, 140, 0.1);
                color: var(--profit-green);
                font-weight: 700;
                font-size: 0.9rem;
                font-variant-numeric: tabular-nums;
            }

            a {
                color: var(--text);
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
                color: var(--bg);
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <a href="/" class="brand">
                <img src="/images/VLogo.png" alt="Vault home">
            </a>
            <nav>
                <a href="#">
                    <span class="icon icon-bz"></span>
                    Bazaar
                </a>
                <a href="#">
                    <span class="icon icon-ah"></span>
                    Auction House
                </a>
                <a href="#">
                    <span class="icon icon-flips"></span>
                    Flips
                </a>
                <a href="#">
                    <span class="icon icon-ana"></span>
                    Analytics
                </a>
                <a href="/items">
                    <span class="icon icon-items"></span>
                    Items
                </a>
            </nav>
            <a href="#">Discord</a>
        </header>
        <section class ="hero">
            <img class="hero-logo" src="/images/logoplaceholder.jpg" alt="">
            <label class="search-box" for="search">
                <img src="/images/search.svg" alt="">
                <input id="search" type="text" placeholder="Search for an item...">
                <button type="submit" class="search-button">
                    <img src="/images/arrow-right.svg" alt="Search">
                </button>
            </label>
        </section>
        <main class="cards">
            <section class="card">
                <div class="card-header">
                    <h3>Top Flips</h3>
                    <a href="/items" class="view-all">View all →</a>
                </div>
                <ol class="card-list">
                    <li class="row">
                        <span class="rank">#1</span>
                        <div class="row-info">
                            <span class="row-name">Enchanted Diamond</span>
                            <span class="row-sub">Buy 1.2k → Sell 1.8k</span>
                        </div>
                        <span class="row-value">+50.0%</span>
                    </li>
                    <li class="row">
                        <span class="rank">#2</span>
                        <div class="row-info">
                            <span class="row-name">Enchanted Diamond</span>
                            <span class="row-sub">Buy 1.2k → Sell 1.8k</span>
                        </div>
                        <span class="row-value">+50.0%</span>
                    </li>
                    <li class="row">
                        <span class="rank">#3</span>
                        <div class="row-info">
                            <span class="row-name">Enchanted Diamond</span>
                            <span class="row-sub">Buy 1.2k → Sell 1.8k</span>
                        </div>
                        <span class="row-value">+50.0%</span>
                    </li>
                </ol>
            </section>
        </main>
    </body>
</html>
