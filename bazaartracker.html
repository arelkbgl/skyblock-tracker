<!DOCTYPE html>
<!--
    Live Bazaar table: current buy/sell prices, flip margins and weekly volume.
    Served by server.js at "/". Item names link to /chart?item=<id>.
-->
<html>
    <head>
        <title>Bazaar Tracker</title>
        <style>
            body {
                font-family: sans-serif;
                background-color: #1e1e1e;
                color: white;
                padding: 20px;
            }

            table {
                border-collapse: collapse;
            }

            thead {
                background-color: rgb(100, 23, 13);
            }

            th, td {
                padding: 6px 12px;
                border-bottom: 1px solid #444;
                text-align: right;
            }

            th {
                cursor: pointer;
            }

            /* Item names are text, so align them left; all other columns are numbers. */
            th:first-child, td:first-child {
                text-align: left;
            }

            a {
                color: rgb(225, 236, 107);
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <h1>Bazaar Tracker</h1>
        <input id="search" type="text" placeholder="Search item...">
        <table>
            <thead>
                <tr>
                    <!-- data-key = the row field this column sorts by -->
                    <th data-key="name">Item</th>
                    <th data-key="buyPrice">Buy</th>
                    <th data-key="sellPrice">Sell</th>
                    <th data-key="margin">Margin</th>
                    <th data-key="marginPercent">Margin Percent</th>
                    <th data-key="weeklyVolume">Weekly Volume</th>
                </tr>
            </thead>
            <tbody id="item-table"></tbody>
        </table>

        <script>
            const rows = [];
            const searchInput = document.getElementById("search");

            let sortKey = "marginPercent";
            let sortDescending = true;

            function addCell(tr, text) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.append(td);
            }

            // Fetches the live Bazaar data once and builds the row list.
            async function loadBazaar() {
                const response = await fetch("https://api.hypixel.net/v2/skyblock/bazaar");
                const data = await response.json();
                const items = Object.keys(data.products);

                for (const itemId of items) {
                    const status = data.products[itemId].quick_status;

                    // Only the smaller side can actually fill, so it limits a flip.
                    const weeklyVolume = Math.min(status.buyMovingWeek, status.sellMovingWeek);

                    // Hide items with an empty order book side or too little volume to flip.
                    if (status.buyPrice !== 0 && status.sellPrice !== 0 && weeklyVolume >= 100_000) {
                        // Flip: buy order at sellPrice, sell offer at buyPrice.
                        const margin = status.buyPrice - status.sellPrice;
                        const marginPercent = margin / status.sellPrice * 100;

                        const row = {
                            id: itemId,
                            name: prettyName(itemId),
                            buyPrice: status.buyPrice,
                            sellPrice: status.sellPrice,
                            margin: margin,
                            marginPercent: marginPercent,
                            weeklyVolume: weeklyVolume
                        };
                        rows.push(row);
                    }
                }

                renderTable("");
            }

            // Redraws the table from `rows`, applying the search filter and current sort.
            function renderTable(search) {
                // Ignore case and spaces so "ench dia" style input still matches.
                const lowerSearch = search.toLowerCase().replaceAll(" ", "");
                const render = [];
                const tableBody = document.getElementById("item-table");
                tableBody.textContent = "";

                for (const row of rows) {
                    if (row.name.toLowerCase().replaceAll(" ", "").includes(lowerSearch)) {
                        render.push(row);
                    }
                }

                if (sortKey === "name") {
                    // For names, "descending" means A→Z so the first click sorts alphabetically.
                    if (sortDescending) {
                        render.sort((a, b) => a[sortKey].localeCompare(b[sortKey]));
                    } else {
                        render.sort((a, b) => b[sortKey].localeCompare(a[sortKey]));
                    }
                } else {
                    if (sortDescending) {
                        render.sort((a, b) => b[sortKey] - a[sortKey]);
                    } else {
                        render.sort((a, b) => a[sortKey] - b[sortKey]);
                    }
                }

                for (const row of render) {
                    const tr = document.createElement("tr");

                    const td = document.createElement("td");
                    const link = document.createElement("a");
                    link.href = "/chart?item=" + row.id;
                    link.textContent = row.name;
                    td.append(link);
                    tr.append(td);

                    addCell(tr, row.buyPrice.toFixed(1));
                    addCell(tr, row.sellPrice.toFixed(1));
                    addCell(tr, row.margin.toFixed(1));
                    addCell(tr, row.marginPercent.toFixed(1) + "%");
                    addCell(tr, row.weeklyVolume.toLocaleString());

                    tableBody.append(tr);
                }
            }

            // "ENCHANTED_DIAMOND" → "Enchanted Diamond"
            function prettyName(id) {
                const lower = id.toLowerCase().split("_");
                const fixed = [];

                for (const word of lower) {
                    const pretty = word.charAt(0).toUpperCase() + word.slice(1);
                    fixed.push(pretty);
                }

                return fixed.join(" ");
            }

            searchInput.addEventListener("input", () => {
                renderTable(searchInput.value);
            });

            // Clicking the active column flips the direction; a new column starts descending.
            const headers = document.querySelectorAll("th");
            for (const th of headers) {
                th.addEventListener("click", () => {
                    if (th.dataset.key === sortKey) {
                        sortDescending = !sortDescending;
                    } else {
                        sortKey = th.dataset.key;
                        sortDescending = true;
                    }
                    renderTable(searchInput.value);
                });
            }

            loadBazaar();
        </script>
    </body>
</html>
